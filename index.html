{id:5,p:'j',u:1,m:[{call:'Missed call · Julian Park',tm:'08:05'},{f:'j',x:'A penthouse just came off-market. Shall I send details?',tm:'08:07'}]},
{id:6,p:'d',req:1,u:1,intro:'Alexander, we met at the Davos dinner. I would value a connection.',m:[]}];
let CALLS=[{p:'m',k:'video',d:'Completed',du:'24 min',w:'Yesterday'},{p:'j',k:'audio',d:'Missed',du:'',w:'Today'},{p:'e',k:'audio',d:'Outgoing',du:'6 min',w:'Mon'},{p:'s',k:'video',d:'Completed',du:'41 min',w:'Last week'}];
let cur=null,tab='home',flt='All',q='',rep=null,S={rr:1},T=null,sec=0,cs={};
const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const lt=tz=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',timeZone:tz});
const nm=c=>c.g?c.name:P[c.p].n;
const av=(k,z=40)=>{const i=Object.keys(P).indexOf(k);const n=k==='g'?'G':P[k].n;return `<div class="av" style="width:${z}px;height:${z}px;background:${COL[i<0?0:i]};font-size:${z/2.6}px">${k==='g'?'H':n.split(' ').map(w=>w[0]).join('')}</div>`};
const cav=(c,z)=>c.g?av('g',z):av(c.p,z);
const stl=k=>`<span class="dot" style="background:${ST[k][1]}"></span>${ST[k][0]}`;
const prev=c=>{const m=c.m[c.m.length-1];return c.req?c.intro:!m?'':m.call||(m.a?'📎 '+m.a.n:m.x)};
function renderList(){
 $('#sb').hidden=tab!=='msg';
 if(tab==='calls'){$('#list').innerHTML=CALLS.map((c,i)=>`<li class="cl" style="cursor:default">${av(c.p,40)}<div class="li"><b>${P[c.p].n}</b><div style="color:${c.d==='Missed'?'#B91C1C':'var(--mu)'};font-size:.8rem">${c.k==='video'?'Video':'Audio'} · ${c.d}${c.du?' · '+c.du:''} · ${c.w}</div></div><button class="ib" data-cb="${i}" aria-label="Call back">${ic(c.k==='video'?'video':'phone')}</button></li>`).join('');return}
 $('#fl').innerHTML=['All','Unread','Direct','Groups','Requests'].map(f=>`<button class="${f===flt?'on':''}">${f}</button>`).join('');
 const L=C.filter(c=>({All:1,Unread:c.u>0,Direct:!c.g&&!c.req,Groups:c.g,Requests:c.req})[tab==='home'?'All':flt]&&(!q||(nm(c)+' '+(c.p?P[c.p].c+P[c.p].h:'')+c.m.map(m=>m.x||'').join(' ')).toLowerCase().includes(q))).sort((a,b)=>(b.pin||0)-(a.pin||0));
 $('#list').innerHTML=L.map(c=>`<li data-id="${c.id}" class="${cur&&cur.id===c.id?'on':''}">${cav(c,44)}<div class="li"><div class="r1"><b>${c.pin?'◆ ':''}${E(nm(c))}</b><span>${c.m.length?c.m[c.m.length-1].tm:''}</span></div><div class="r2"><span>${E(prev(c))}</span>${c.u?`<span class="badge">${c.u}</span>`:''}</div></div></li>`).join('')||'<li style="color:var(--mu)">No conversations found.</li>'}
function renderChat(keep){
 const c=cur,el=$('#chat');if(tab==='home'){home(el);return}
 if(!c){el.innerHTML='<div class="empty"><div class="mono" style="margin:0 auto 1rem">A</div><p class="serif" style="font-size:1.5rem;margin:0">Select a conversation</p><p>Private correspondence for modern leaders.</p></div>';return}
 const p=c.g?null:P[c.p];
 el.innerHTML=`<div class="ch"><button class="ib back" aria-label="Back">${ic('back')}</button>${cav(c,40)}<div class="t" id="ti"><b>${E(nm(c))}</b><span>${c.g?c.mem.length+1+' members':p.t+' · '+p.c}</span></div><button class="ib" data-call="audio" aria-label="Audio call">${ic('phone')}</button><button class="ib" data-call="video" aria-label="Video call">${ic('video')}</button><button class="ib" id="ti2" aria-label="Details">${ic('info')}</button></div>
 ${c.req?`<div class="req"><b>Connection request</b><p>“${E(c.intro)}”</p><button class="btn" id="acc">Accept</button> <button class="btn o" id="ign">Ignore</button></div>`:''}
 <div id="msgs">${c.m.map((m,i)=>{if(m.call)return `<div class="sys">${ic('phone',13)} ${m.call} · ${m.tm}</div>`;const me=m.f==='me',rx={};(m.r||[]).forEach(e=>rx[e]=(rx[e]||0)+1);
 return `<div class="row ${me?'mine':''}" data-i="${i}"><div class="hov">${['👍','❤️','👏','🤝','✅'].map(e=>`<button data-r="${e}">${e}</button>`).join('')}<button data-rep aria-label="Reply">↩</button></div><div class="bub">${c.g&&!me?`<div class="who">${P[m.f].n}</div>`:''}${m.q!=null&&c.m[m.q]?`<div class="quote">${E(c.m[m.q].x||c.m[m.q].a.n)}</div>`:''}${m.a?`<div class="file"><i>${m.a.k}</i><div>${E(m.a.n)}<small>${m.a.z}</small></div><a href="#" data-dl>Download</a></div>`:''}${m.x?E(m.x):''}<div class="meta">${m.tm}${me&&S.rr?` <span class="tk ${m.s===3?'rd':''}">${m.s===1?'✓':'✓✓'}</span>`:''}</div></div>${Object.keys(rx).length?`<div class="rx">${Object.entries(rx).map(([e,n])=>`<span>${e}${n>1?' '+n:''}</span>`).join('')}</div>`:''}</div>`}).join('')}</div>
 <div id="typing" aria-live="polite">${c.ty?E(c.g?P[c.mem[0]].n:p.n.split(' ')[0])+' is typing…':''}</div>
 ${rep!=null?`<div id="rp"><span>Replying to: ${E(c.m[rep].x||c.m[rep].a.n)}</span><button id="xr" aria-label="Cancel reply">✕</button></div>`:''}
 <div class="cmp"><label class="ib" style="cursor:pointer" aria-label="Attach file">${ic('clip')}<input type="file" id="fi" hidden></label><input type="text" id="mi" placeholder="Write a message" aria-label="Message"><button class="ib" id="eb" aria-label="Emoji">${ic('smile')}</button><button class="btn" id="sb2" aria-label="Send" style="padding:.55rem .8rem">${ic('send',16)}</button><div id="emo" hidden>${'👍❤️👏🤝✅🙏🎉🥂💼📈🔒⭐🌍☕✈️🏛️😊😂🤔👀💡📎🗓️🚀'.match(/\p{Extended_Pictographic}\uFE0F?/gu).map(e=>`<button>${e}</button>`).join('')}</div></div>`;
 const mg=$('#msgs');mg.scrollTop=mg.scrollHeight;
 const t=$('#ti2');if(!keep)document.querySelector('#msgs');
}
function renderInfo(){
 const c=cur;if(!c){$('#info').innerHTML='';return}
 const fs=c.m.filter(m=>m.a),cl=c.g?[]:CALLS.filter(x=>x.p===c.p);
 const f=fs.map(m=>`<div class="file"><i>${m.a.k}</i><div>${E(m.a.n)}<small>${m.a.z}</small></div></div>`).join('')||'<p style="color:var(--mu);margin:0">No shared files yet.</p>';
 if(c.g){$('#info').innerHTML=`<div class="pc">${av('g',72)}<h3>${E(c.name)}</h3><p>Private group · ${c.mem.length+1} members</p></div><h4>Members</h4>${['me',...c.mem].map(k=>`<div class="cl" style="border:0;padding:.3rem 0">${av(k,32)}<div class="li">${P[k].n}<small style="display:block;color:var(--mu)">${k==='me'?'Admin':k==='e'?'Admin':'Member'}</small></div></div>`).join('')}<h4>Shared files</h4>${f}<button class="ib" id="ci" style="float:right">${ic('back')}</button>`;return}
 const p=P[c.p];
 $('#info').innerHTML=`<div class="pc">${av(c.p,72)}<h3>${p.n}</h3><p>${p.t}</p><p>${p.c} · ${p.i}</p><p>${stl(p.s)}</p><p>${p.l} · ${lt(p.tz)} local</p></div><h4>About</h4><p style="margin:0">${p.b}</p><p style="margin:.5rem 0 0"><a href="#" style="color:var(--gold)">${p.w}</a> · ${p.h}</p><h4>Call history</h4>${cl.map(x=>`<div style="font-size:.85rem;color:var(--mu)">${x.k==='video'?'Video':'Audio'} · ${x.d}${x.du?' · '+x.du:''} · ${x.w}</div>`).join('')||'<p style="color:var(--mu);margin:0">No calls yet.</p>'}<h4>Shared files</h4>${f}<button class="btn o" id="ci" style="margin-top:1rem;width:100%">Close</button>`}
function open(id){cur=C.find(c=>c.id===id);cur.u=0;tab='msg';syncTabs();rep=null;$('#app').classList.add('vc');renderList();renderChat();renderInfo()}
function syncTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#app').classList.toggle('hm',tab==='home');if(tab==='home')$('#app').classList.remove('io','vc')}
function splash(){const s=$('#splash');s.classList.remove('up');s.hidden=false;setTimeout(()=>{s.classList.add('up');setTimeout(()=>{s.hidden=true},950)},1700)}
function home(el){const m=P.me,h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening',un=C.reduce((a,c)=>a+(c.req?0:c.u),0);
 el.innerHTML=`<div id='hm'><div class='hbn'>${g}, Alexander</div><div class='hw'><div class='hc'><div class='hav'>${av('me',104)}</div><div class='hn'><h2>${m.n}</h2><p>${m.t}, ${m.c}</p><p>${m.l} · ${lt(m.tz)} local</p></div><select id='st' aria-label='Availability'>${Object.keys(ST).map(k=>`<option value='${k}' ${k===m.s?'selected':''}>${ST[k][0]}</option>`).join('')}</select></div>
<div class='hs'><div><b>${un}</b><span>Unread messages</span></div><div><b>${C.filter(c=>c.req).length}</b><span>Pending requests</span></div><div><b>${C.filter(c=>c.p&&!c.req).length}</b><span>Connections</span></div></div>
<div class='hb'><p style='margin:0 0 .75rem'>${m.b}</p><p style='margin:0;color:var(--mu);font-size:.9rem'>${m.h} · ${m.i} · <a href='#' style='color:var(--gold)'>${m.w}</a></p></div>
<h3>Recent conversations</h3>${C.filter(c=>!c.req).slice(0,4).map(c=>`<button class='hr' data-o='${c.id}'>${cav(c,40)}<div class='li'><div class='r1'><b>${E(nm(c))}</b><span>${c.m[c.m.length-1].tm}</span></div><div class='r2'><span>${E(prev(c))}</span>${c.u?`<span class='badge'>${c.u}</span>`:''}</div></div></button>`).join('')}
<div style='display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap'><button class='btn' data-h='msg'>Open messages</button><button class='btn o' data-h='calls'>Calls</button><button class='btn o' data-h='set'>Settings</button></div></div></div>`}
const mk=(c,x,a)=>{c.m.push({f:'me',x,a,q:rep,tm:now(),s:1});rep=null};
function send(x,a){const c=cur;if(!c||c.req||(!x&&!a))return;mk(c,x,a);const m=c.m[c.m.length-1];renderChat();renderList();
 setTimeout(()=>{m.s=2;cur===c&&renderChat()},600);
 setTimeout(()=>{c.ty=1;cur===c&&renderChat()},1200);
 setTimeout(()=>{c.ty=0;const k=c.g?c.mem[0]:c.p;c.m.forEach(z=>z.f==='me'&&(z.s=3));c.m.push({f:k,x:['Understood. Thank you.','Agreed. Let’s proceed.','Noted. I’ll revert shortly.','Excellent. Speak soon.'][Math.random()*4|0],tm:now()});if(cur===c){renderChat()}else c.u++;renderList()},3000)}
document.addEventListener('click',e=>{
 const t=e.target,g=s=>t.closest(s);
 if(g('.go')){$('#login').hidden=true;$('#app').hidden=false;$('#gear').innerHTML=ic('gear');syncTabs();renderList();renderChat();splash();setTimeout(()=>incoming(2),12000);return}
 if(g('.tabs button')){tab=g('.tabs button').dataset.t;if(tab==='home')cur=null;syncTabs();renderList();renderChat();return}
 if(g('#fl button')){flt=t.textContent;renderList();return}
 if(g('#list li[data-id]')){open(+g('#list li').dataset.id);return}
 if(g('[data-cb]')){const x=CALLS[+g('[data-cb]').dataset.cb];cur=C.find(c=>c.p===x.p);open(cur.id);startCall(x.k);return}
 if(g('#gear')){settings();return}
 if(g('[data-h]')){const h=g('[data-h]').dataset.h;if(h==='set'){settings();return}tab=h;cur=null;syncTabs();renderList();renderChat();return}
 if(g('[data-o]')){open(+g('[data-o]').dataset.o);return}
 if(g('.back')){$('#app').classList.remove('vc','io');return}
 if(g('#ti')||g('#ti2')){$('#app').classList.toggle('io');renderInfo();return}
 if(g('#ci')){$('#app').classList.remove('io');return}
 if(g('[data-call]')){startCall(g('[data-call]').dataset.call);return}
 if(g('#sb2')){const i=$('#mi');send(i.value.trim());return}
 if(g('#eb')){$('#emo').hidden=!$('#emo').hidden;return}
 if(g('#emo button')){const i=$('#mi');i.value+=t.textContent;i.focus();return}
 if(g('#xr')){rep=null;renderChat();return}
 if(g('#acc')){cur.req=0;cur.intro&&cur.m.push({f:cur.p,x:cur.intro,tm:now()});renderChat();renderList();return}
 if(g('#ign')){C=C.filter(c=>c!==cur);cur=null;$('#app').classList.remove('vc');renderChat();renderList();return}
 if(g('[data-dl]')){e.preventDefault();return}
 const row=g('.row');
 if(row&&g('[data-r]')){const m=cur.m[+row.dataset.i],r=t.closest('[data-r]').dataset.r;m.r=m.r||[];const k=m.r.indexOf(r);k<0?m.r.push(r):m.r.splice(k,1);renderChat();return}
 if(row&&g('[data-rep]')){rep=+row.dataset.i;renderChat();$('#mi').focus();return}
 if(!g('#emo')&&$('#emo'))$('#emo').hidden=true;
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mi')send(e.target.value.trim());if(e.key==='Enter'&&e.target.id==='ci2'){const v=e.target.value.trim();if(v){mk(cur,v);e.target.value='';csr()}}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase();renderList()}});
document.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(e.target.id==='fi'&&f){const k=(f.name.split('.').pop()||'FILE').slice(0,3).toUpperCase();send('',F(f.name,f.size>1e6?(f.size/1e6).toFixed(1)+' MB':Math.ceil(f.size/1e3)+' KB',k))}
 if(e.target.id==='st'){P.me.s=e.target.value;return}if(e.target.id==='rr')S.rr=e.target.checked,renderChat();if(e.target.id==='dn')$('#app').classList.toggle('compact',e.target.value==='Compact')});
/* calls */
function incoming(id){const c=C.find(x=>x.id===id),p=P[c.p];if(!$('#call').hidden)return;const el=$('#inc');el.hidden=false;el.innerHTML=`<div class="g">${av(c.p,48)}<div><b>${p.n}</b><small>${p.t}, ${p.c}</small><small>Auren video call…</small></div></div><div class="a"><button class="btn" id="ia">Accept</button><button class="btn o" id="id">Decline</button></div>`;
 $('#ia').onclick=()=>{el.hidden=true;open(id);startCall('video')};$('#id').onclick=()=>{el.hidden=true;c.m.push({call:'Declined call',tm:now()});CALLS.unshift({p:c.p,k:'video',d:'Declined',du:'',w:'Today'});renderList()}}
function startCall(k){const c=cur;cs={k,mic:1,cam:k==='video',sc:0,side:0,c};sec=0;$('#call').hidden=false;$('#call').classList.remove('mini');drawCall();T=setInterval(()=>{sec++;const el=$('#dur');if(el)el.textContent=fmt()},1000)}
const fmt=()=>String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
function csr(){const el=$('#cs');if(el)el.innerHTML=cs.c.m.slice(-5).map(m=>m.call?'':`<div><b>${m.f==='me'?'You':P[m.f].n.split(' ')[0]}</b>: ${E(m.x||m.a.n)}</div>`).join('')+'<input id="ci2" type="text" placeholder="Message during call" style="border:1px solid var(--l);border-radius:8px;padding:.4rem;margin-top:auto" aria-label="In-call message">'}
function drawCall(){const c=cs.c,k=c.g?'g':c.p;
 $('#call').innerHTML=`<div class="stg"><div class="cinfo">${E(nm(c))} · <span id="dur">${fmt()}</span> · ▂▄▆ HD${cs.sc?' · You’re presenting':''}</div><div style="text-align:center;outline:3px solid ${'#8B7355'};outline-offset:10px;border-radius:50%;width:fit-content">${av(k,110)}</div><div class="me-t">${cs.cam?'You':'Camera off'}</div>${cs.side?'<div id="cs"></div>':''}</div>
 <div class="ctl"><button class="${cs.mic?'':'off'}" data-c="mic" aria-label="Mute">${ic(cs.mic?'mic':'micoff')}</button><button class="${cs.cam?'':'off'}" data-c="cam" aria-label="Camera">${ic(cs.cam?'video':'camoff')}</button><button class="${cs.sc?'off':''}" data-c="sc" aria-label="Share screen">${ic('screen')}</button><button data-c="side" aria-label="Chat">${ic('chat')}</button><button class="pip" data-c="pip" aria-label="Mini window">${ic('pip')}</button><button class="end" data-c="end" aria-label="End call">${ic('end')}</button></div>`;
 csr();document.querySelectorAll('#call [data-c]').forEach(b=>b.onclick=()=>{const a=b.dataset.c;if(a==='end'){clearInterval(T);const l=`${cs.k==='video'?'Video':'Audio'} call · Outgoing · ${Math.max(1,Math.round(sec/60))} min`;cs.c.m.push({call:l,tm:now()});if(!cs.c.g)CALLS.unshift({p:cs.c.p,k:cs.k,d:'Outgoing',du:Math.max(1,Math.round(sec/60))+' min',w:'Today'});$('#call').hidden=true;renderList();cur===cs.c&&renderChat();return}
  if(a==='pip'){$('#call').classList.toggle('mini');return}cs[a]=!cs[a];drawCall()})}
/* settings */
function settings(){const s=$('#set');s.hidden=false;s.innerHTML=`<div class="card"><h2 class="serif">Settings</h2><div class="tg"><span>Who can message or call you</span><select><option>Connections only</option><option>Everyone</option><option>Approval required</option></select></div><div class="tg"><span>Show online status</span><input type="checkbox" checked></div><div class="tg"><span>Show last seen</span><input type="checkbox" checked></div><div class="tg"><span>Read receipts</span><input id="rr" type="checkbox" ${S.rr?'checked':''}></div><div class="tg"><span>Disappearing messages</span><select><option>Off</option><option>24 hours</option><option>7 days</option><option>30 days</option></select></div><div class="tg"><span>Message alerts</span><input type="checkbox" checked></div><div class="tg"><span>Text density</span><select id="dn"><option>Comfortable</option><option>Compact</option></select></div><button class="btn" id="sx" style="margin-top:1rem;width:100%">Done</button></div>`;$('#sx').onclick=()=>s.hidden=true}
</script>
</body>
</html>
